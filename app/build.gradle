plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dshpet.pet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dshpet.pet'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['webm']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
